name: scoring

source:
  type: csv
  params:
    file_path: ./data/data.csv

adapter:
  # Extract content field from the file data
  type: field
  params:
    field: statement
    default_value: ""

transformers:
  # Clean the content by removing excessive whitespace
  - type: lowercase
  - type: remove_stopwords
  - type: remove_unicode
  - type: text_normalization
  - type: filter-metadata
    params:
      metadata:
        - field: speaker_name
          default_value: "Undefined"
        - field: subjects
          default_value: "Undefined"
        - field: speaker_job
          default_value: "Undefined"
        - field: speaker_state
          default_value: "Undefined"
        - field: speaker_affiliation
          default_value: "Undefined"
        - field: statement_context
          default_value: "Undefined"
  - type: llm
    params:
      model:
        provider: openai-compatible
        model: qwen2.5:0.5b
        base_url: http://localhost:11434/v1
        dimensions: 1024
        api_key: test-key
      target: metadata
      timeout: 300
      system_prompt: |
        You are an unbiased, rigorous fact-checker with the utmost integrity. You judge only facts and evidence,
        never political parties, ideologies, perspectives or persons. You NEVER make up information or provide
        false information.

        Respond ONLY with a single JSON object and nothing else, matching exactly this shape:
        {"is_true": <true or false>, "confidence": <number 0.0 to 1.0>, "hint": "<one-sentence explanation>"}

        Rules:
        - "is_true": true only if the statement is factually accurate as stated.
        - "confidence": how sure you are of your verdict, 0.0 means not confident at all, 1.0 means very confident.
        - "hint": one brief sentence justifying your verdict. If you cannot verify the statement, set confidence
          below 0.5 and write "I am not confident in my answer." as the hint.
      user_prompt_template:  |
        Given the following metadata
          spearer_name: {{ metadata.speaker_name }}
          subject: {{ metadata.subjects }}
          speaker_job: {{ metadata.speaker_job }}
          speaker_state: {{ metadata.speaker_state }}
          speaker_affiliation: {{ metadata.speaker_affiliation }}
          statement_context: {{ metadata.statement_context }}
        Fact-check the statement below. Reply with the JSON object only:
        {{ source }}
      response_format:
        type: json_schema
        json_schema:
          name: verdict_response
          strict: true
          schema:
            type: object
            properties:
              is_true:
                type: boolean
                description: Whether the statement is factually true.
              confidence:
                type: number
                description: Confidence in the verdict, from 0.0 (not confident) to 1.0 (very confident).
              hint:
                type: string
                description: One-sentence explanation of the verdict.
            required:
              - is_true
              - confidence
              - hint
            additionalProperties: false

destination:
  type: file
  params:
    filename: ./data/scored.jsonl
    as_json: true
