services:
  app:
    build:
      dockerfile: docker/Dockerfile
      context: ../
      target: local
      args:
        - APP_NAME=app
    container_name: app
    depends_on:
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      ollama:
        condition: service_healthy
    restart: always
    env_file:
      - ../.env
    environment:
      - CORE_MQ_KAFKA_BROKERS=kafka:29092
      - OTEL_ENDPOINT=http://otel-collector:4318/v1/traces
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
    # Mount source for hot reload in container
    volumes:
      - ../app:/app/app
    ports:
      - "3000:8080"
    networks:
      - app

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    container_name: app-kafka
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    networks:
      - app

  kafka-ui:
    image: kafbat/kafka-ui
    container_name: app-kafka-ui
    ports:
      - 8080:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: app-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - app
    depends_on:
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:18
    container_name: app-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app
    volumes:
      - pg_data:/var/lib/postgresql
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- tracing / metrics demo stack ----
  otel-collector:
    image: otel/opentelemetry-collector:0.105.0
    container_name: app-otel-collector
    command: ["--config=/etc/otel-collector.yml"]
    volumes:
      - ./otel-collector.yml:/etc/otel-collector.yml
    ports:
      - "4318:4318"   # OTLP http
      - "4317:4317"   # OTLP grpc
    networks:
      - app
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    container_name: app-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
    networks:
      - app

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: app-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - app
  
  ollama:
    image: ollama/ollama:latest
    container_name: app-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pg_data:
  ollama_data:
networks:
  app:
    driver: bridge