name: Base image Build
run-name: "Build: ${{ github.ref_name }}"

on:
  push:
    tags:
      - v*

env:
  AWS_REGION: eu-central-1

jobs:
  build:
    environment: "${{ contains(github.ref, 'tags/') && contains(github.ref_name, '-rc') && 'staging' || contains(github.ref, 'tags/') && 'production' || 'development' }}"
    runs-on: [self-hosted]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout current tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Placeholder
      # - name: Login to container registry
      # - login-ecr

      # Extract a deterministic image tag: on tag pushes we strip the "v" prefix
      # (e.g. "v1.2.3" -> "1.2.3"); on branch pushes we fall back to a unix timestamp
      # so each push yields a unique tag that still sorts chronologically.
      - name: Extract version tag
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "branch" ]]; then
            TAG="main-$(date -u +'%s')"
          else
            TAG="${GITHUB_REF_NAME#v}"
          fi
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

      # cache-from/cache-to points Buildkit at a dedicated ":cache" tag in the registry.
      # mode=max caches every stage layer (including intermediate build stages),
      # so subsequent builds can reuse unchanged layers and only rebuild on changes.
      - name: Build and push docker image to Amazon ECR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.version.outputs.image_tag }}
          build-args: |
            GIT_HASH=${{ github.sha }}
            TAG=${{ steps.version.outputs.image_tag }}
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:cache
          cache-to: type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:cache
